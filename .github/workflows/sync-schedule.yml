name: Sync NHL Schedule Times

on:
  schedule:
    - cron: '0 8 * * *' # Run daily at 8am UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run Update Script
        run: python3 scripts/update_times.py
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync NHL schedule times" && git push)
