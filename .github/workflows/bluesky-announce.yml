name: Bluesky Service Announcement

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate publication without calling Bluesky XRPC APIs'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate OG Social Cards
        run: node scripts/generate_og_cards.js

      - name: Publish Service Announcements to Bluesky
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/post_bluesky_announce.js --dry-run
          else
            node scripts/post_bluesky_announce.js
          fi
        env:
          BSKY_MAIN_IDENTIFIER: ${{ secrets.BSKY_MAIN_IDENTIFIER }}
          BSKY_MAIN_PASSWORD: ${{ secrets.BSKY_MAIN_PASSWORD }}
          BSKY_US_IDENTIFIER: ${{ secrets.BSKY_US_IDENTIFIER }}
          BSKY_US_PASSWORD: ${{ secrets.BSKY_US_PASSWORD }}
