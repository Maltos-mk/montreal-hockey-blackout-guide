name: Bluesky Concierge Radar

on:
  schedule:
    # Off-peak prime-time puck-drop windows (90-min lookback windows):
    # 22:23 UTC = 5:23 PM EST / 6:23 PM EDT (Early pre-game inquiries)
    # 00:23 UTC = 7:23 PM EST / 8:23 PM EDT (Puck-drop & 1st intermission)
    # 02:23 UTC = 9:23 PM EST / 10:23 PM EDT (West Coast & late games)
    - cron: '23 22 * * *'
    - cron: '23 0 * * *'
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate scan without sending Discord webhook alerts'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Bluesky Concierge Radar
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Running radar in DRY-RUN mode..."
            node scripts/bluesky_concierge_radar.js --dry-run
          else
            echo "Running live radar scan..."
            node scripts/bluesky_concierge_radar.js
          fi
        env:
          BSKY_MAIN_IDENTIFIER: ${{ secrets.BSKY_MAIN_IDENTIFIER }}
          BSKY_MAIN_PASSWORD: ${{ secrets.BSKY_MAIN_PASSWORD }}
          CONCIERGE_WEBHOOK_URL: ${{ secrets.CONCIERGE_WEBHOOK_URL }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
