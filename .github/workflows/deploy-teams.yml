name: Deploy Teams to Separate Repos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Run Schema and Logic Verification
        run: node tests/verify_build.js

  deploy-montreal:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Prepare Montreal Build
        run: |
          mkdir build
          cp -r shared build/
          cp -r data/mtl.json build/data.json
          cp -r teams/montreal/* build/
          cp LICENSE build/
          cp README.md build/
          
          # Fix paths to be root-relative for the standalone deployment
          sed -i 's|\.\./\.\./shared/|shared/|g' build/index.html
          sed -i 's|\.\./\.\./data/mtl.json|data.json|g' build/index.html
          
          # Inject cache-busters into HTML assets so PWAs force update
          TIMESTAMP=$(date +%s)
          sed -i "s|shared/app.css|shared/app.css?v=$TIMESTAMP|g" build/index.html
          sed -i "s|shared/app.js|shared/app.js?v=$TIMESTAMP|g" build/index.html
          sed -i "s|shared/i18n.js|shared/i18n.js?v=$TIMESTAMP|g" build/index.html
          sed -i "s|data.json|data.json?v=$TIMESTAMP|g" build/index.html
          
          
      - name: Deploy Montreal to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages

  deploy-toronto:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Prepare Toronto Build
        run: |
          mkdir build
          cp -r shared build/
          cp -r data/tor.json build/data.json
          cp -r teams/toronto/* build/
          cp LICENSE build/
          cp README.md build/
          
          # Fix paths
          sed -i 's|\.\./\.\./shared/|shared/|g' build/index.html
          sed -i 's|\.\./\.\./data/tor.json|data.json|g' build/index.html
          
          # Inject cache-busters into HTML assets so PWAs force update
          TIMESTAMP=$(date +%s)
          sed -i "s|shared/app.css|shared/app.css?v=$TIMESTAMP|g" build/index.html
          sed -i "s|shared/app.js|shared/app.js?v=$TIMESTAMP|g" build/index.html
          sed -i "s|shared/i18n.js|shared/i18n.js?v=$TIMESTAMP|g" build/index.html
          sed -i "s|data.json|data.json?v=$TIMESTAMP|g" build/index.html
          
          
      - name: Deploy Toronto to Separate Repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: 'build'
          destination-github-username: 'Maltos-mk'
          destination-repository-name: 'toronto-hockey-blackout-guide'
          user-email: 'bot@maltos-mk.com'
          target-branch: main

