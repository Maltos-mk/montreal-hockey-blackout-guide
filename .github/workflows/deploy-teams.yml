name: Build and Deploy Everything

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * *' # Daily 9am UTC (5am ET) rebuild to keep upcoming matchups fresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Unified Package
        run: node scripts/build_all.js

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Automated QA Suite
        run: npm run test:all
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: hockeyblackouts.ca

      # - name: Notify Search Engines via IndexNow (Daily Cron Only)
      #   if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      #   run: node scripts/ping_indexnow.js
